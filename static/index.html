<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TurbineTwin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f1117; color: #e6e6e6; }
    h1 { font-weight: 600; }
    #chart-wrap { max-width: 900px; height: 420px; }

    #anomaly-panel { max-width: 900px; margin-top: 1.5rem; }
    #anomaly-panel h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
    #anomaly-panel h2 span { color: #ff8080; }
    #anomaly-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    #anomaly-table th, #anomaly-table td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #2a2e3a; }
    #anomaly-table th { color: #a0aec0; font-weight: 500; text-transform: uppercase; font-size: 0.75rem; }
    #anomaly-empty { color: #a0aec0; font-size: 0.85rem; }

    #controls { display: flex; align-items: center; gap: 0.75rem; max-width: 900px; margin-bottom: 1rem; }
    #controls span { font-size: 0.85rem; color: #a0aec0; }
    .speed-btn {
      background: #1a1d27; border: 1px solid #2a2e3a; color: #e6e6e6;
      border-radius: 6px; padding: 0.4rem 0.9rem; font-size: 0.9rem; cursor: pointer;
    }
    .speed-btn:hover { border-color: #4fd1c5; }
    .speed-btn.active { background: #4fd1c5; color: #0f1117; border-color: #4fd1c5; font-weight: 600; }

    #status-panel { display: flex; gap: 1rem; max-width: 900px; margin-bottom: 1.5rem; }
    .stat-card {
      flex: 1; background: #1a1d27; border: 1px solid #2a2e3a; border-radius: 8px;
      padding: 1rem; transition: background 0.2s, border-color 0.2s;
    }
    .stat-card .label { font-size: 0.8rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-card .value { font-size: 1.8rem; font-weight: 600; margin-top: 0.25rem; }
    /* .is-anomaly toggled by JS below -- not a static class, so it can't be styled by guessing at load time */
    .stat-card.is-anomaly { background: #3a1a1a; border-color: #e05252; }
    .stat-card.is-anomaly .value { color: #ff8080; }
  </style>
</head>
<body>
  <h1>TurbineTwin — Live Power Curve</h1>

  <div id="controls">
    <span>Playback speed:</span>
    <button class="speed-btn" data-speed="1">1x</button>
    <button class="speed-btn" data-speed="10">10x</button>
    <button class="speed-btn" data-speed="100">100x</button>
  </div>

  <div id="status-panel">
    <div class="stat-card">
      <div class="label">Wind Speed</div>
      <div class="value" id="stat-wind">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Measured Power</div>
      <div class="value" id="stat-power">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Deviation</div>
      <div class="value" id="stat-deviation">—</div>
    </div>
    <div class="stat-card" id="stat-status-card">
      <div class="label">Status</div>
      <div class="value" id="stat-status">—</div>
    </div>
  </div>

  <div id="chart-wrap">
    <canvas id="powerChart"></canvas>
  </div>

  <div id="anomaly-panel">
    <h2>Anomalies seen this session: <span id="anomaly-count">0</span></h2>
    <p id="anomaly-empty">None yet.</p>
    <table id="anomaly-table" hidden>
      <thead>
        <tr><th>Time</th><th>Wind (m/s)</th><th>Measured (kW)</th><th>Deviation</th></tr>
      </thead>
      <tbody id="anomaly-rows"></tbody>
    </table>
  </div>

  <script>
    // MAX_POINTS: keep the chart to a rolling window instead of growing
    // forever -- the stream replays ~50k rows, and an unbounded dataset
    // would eventually stall the browser's own render loop.
    const MAX_POINTS = 120;

    const ctx = document.getElementById("powerChart").getContext("2d");
    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [
          {
            label: "Measured (kW)",
            data: [],
            borderColor: "#4fd1c5",
            backgroundColor: "transparent",
            tension: 0.2,
            pointRadius: 0,
          },
          {
            label: "Theoretical (kW)",
            data: [],
            borderColor: "#a0aec0",
            backgroundColor: "transparent",
            borderDash: [4, 4],
            tension: 0.2,
            pointRadius: 0,
          },
        ],
      },
      options: {
        animation: false, // a new point arrives every ~1s (speed=1) -- animating each shift is wasted work
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: "#a0aec0", maxTicksLimit: 8 } },
          y: { ticks: { color: "#a0aec0" }, title: { display: true, text: "kW", color: "#a0aec0" } },
        },
        plugins: { legend: { labels: { color: "#e6e6e6" } } },
      },
    });

    function addPoint(point) {
      const label = point.timestamp.slice(11, 16); // HH:MM from ISO timestamp
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(point.active_power_kw);
      chart.data.datasets[1].data.push(point.theoretical_power_kw);

      if (chart.data.labels.length > MAX_POINTS) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
        chart.data.datasets[1].data.shift();
      }
      chart.update("none"); // "none" skips animation on this update, same reasoning as options.animation above
    }

    const statWind = document.getElementById("stat-wind");
    const statPower = document.getElementById("stat-power");
    const statDeviation = document.getElementById("stat-deviation");
    const statStatus = document.getElementById("stat-status");
    const statStatusCard = document.getElementById("stat-status-card");

    function updateStatusPanel(point) {
      statWind.textContent = `${point.wind_speed.toFixed(1)} m/s`;
      statPower.textContent = `${point.active_power_kw.toFixed(0)} kW`;
      statDeviation.textContent = `${point.deviation_pct.toFixed(1)}%`;

      // Three states, not two -- "below cut-in / above cut-out" (in_range
      // false) is a design-expected idle, not a fault, so it must read
      // differently from is_anomaly (see NOTLAR.md: cut-in/cut-out is a
      // trust boundary, not just a filter).
      if (point.is_anomaly) {
        statStatus.textContent = "ANOMALY";
        statStatusCard.classList.add("is-anomaly");
      } else if (!point.in_range) {
        statStatus.textContent = "Idle (out of range)";
        statStatusCard.classList.remove("is-anomaly");
      } else {
        statStatus.textContent = "Normal";
        statStatusCard.classList.remove("is-anomaly");
      }
    }

    // MAX_ANOMALY_ROWS: same rolling-window reasoning as MAX_POINTS above
    // -- a session can run for a long time (or at speed=1, effectively
    // forever), so the list needs a cap, not unbounded growth.
    const MAX_ANOMALY_ROWS = 10;
    let anomalyCount = 0;
    const anomalyCountEl = document.getElementById("anomaly-count");
    const anomalyEmptyEl = document.getElementById("anomaly-empty");
    const anomalyTableEl = document.getElementById("anomaly-table");
    const anomalyRowsEl = document.getElementById("anomaly-rows");

    function resetAnomalyList() {
      anomalyCount = 0;
      anomalyCountEl.textContent = "0";
      anomalyRowsEl.innerHTML = "";
      anomalyEmptyEl.hidden = false;
      anomalyTableEl.hidden = true;
    }

    function recordAnomaly(point) {
      anomalyCount += 1;
      anomalyCountEl.textContent = String(anomalyCount);
      anomalyEmptyEl.hidden = true;
      anomalyTableEl.hidden = false;

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${point.timestamp.slice(0, 16).replace("T", " ")}</td>
        <td>${point.wind_speed.toFixed(1)}</td>
        <td>${point.active_power_kw.toFixed(0)}</td>
        <td>${point.deviation_pct.toFixed(1)}%</td>
      `;
      anomalyRowsEl.prepend(row); // newest first

      while (anomalyRowsEl.children.length > MAX_ANOMALY_ROWS) {
        anomalyRowsEl.lastElementChild.remove();
      }
    }

    // EventSource is the browser's built-in SSE client -- no library needed.
    // Same-origin (this page is served by the same FastAPI app as /api/stream),
    // so no CORS setup is required.
    //
    // EventSource has no "change the URL" method -- speed is a query
    // param baked into the connection, and the backend has no concept of
    // "resume from where the last connection left off" (it always
    // replays from row 0, see api.py's event_generator). So switching
    // speed means: close the old connection, clear the chart/panel, and
    // open a fresh one at the new speed -- the replay restarts from
    // 2018-01-01 rather than continuing mid-stream.
    let currentSource = null;

    function startStream(speed) {
      if (currentSource) {
        currentSource.close();
      }
      chart.data.labels = [];
      chart.data.datasets[0].data = [];
      chart.data.datasets[1].data = [];
      chart.update("none");
      resetAnomalyList(); // a restarted replay means "anomalies seen this session" restarts too

      currentSource = new EventSource(`/api/stream?speed=${speed}`);
      currentSource.onmessage = (event) => {
        const point = JSON.parse(event.data);
        addPoint(point);
        updateStatusPanel(point);
        if (point.is_anomaly) {
          recordAnomaly(point);
        }
      };
      currentSource.onerror = () => {
        console.error("Stream connection lost.");
      };
    }

    const speedButtons = document.querySelectorAll(".speed-btn");
    speedButtons.forEach((button) => {
      button.addEventListener("click", () => {
        speedButtons.forEach((b) => b.classList.remove("active"));
        button.classList.add("active");
        startStream(Number(button.dataset.speed));
      });
    });

    // Default: 10x, matches the button marked active on load.
    document.querySelector('[data-speed="10"]').classList.add("active");
    startStream(10);
  </script>
</body>
</html>
